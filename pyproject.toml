[project]
name = "form-reconciler"
version = "0.1.0"
description = "Check a fillable PDF's hidden calculation scripts against a spreadsheet for the same procedure"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.0",
    "formulas>=1.3.4",
    "openpyxl>=3.1.5",
    "pikepdf>=10.17.0",
    "pymupdf>=1.28.2",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
